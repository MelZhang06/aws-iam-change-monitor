name: Build and test
run-name: Build and test
on: [push, pull_request]
jobs:
  local-validation:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/check_repository_content.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/change_scenario.py prepare --count 50000 --anchor 2026-10-31T06:00:00Z
      - run: python scripts/build_change_app.py
      - run: python scripts/generate_events.py --anchor 2026-10-25T12:00:00Z --force
      - run: python scripts/check_data.py data/synthetic_cloudtrail.jsonl --manifest data/synthetic_cloudtrail.manifest.json
      - run: python scripts/generate_enterprise.py --anchor 2026-10-28T00:00:00Z --force
      - run: python scripts/check_data.py data/enterprise_cloudtrail.jsonl --profile enterprise --manifest data/enterprise_cloudtrail.manifest.json
      - run: python scripts/verify_enterprise.py data/enterprise_cloudtrail.jsonl
      - run: python scripts/build_enterprise_dashboard.py
      - run: git diff --exit-code -- dashboards/aws_enterprise_identity_investigation.json spl/enterprise lookups/enterprise_accounts.csv lookups/enterprise_identities.csv lookups/enterprise_approved_changes.csv
